<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="../css/favicon.jpg">
<title>Admin Dashboard — Igan's Budbod House</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="admin-shell">
  <div class="mobile-nav-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div>
        <div class="brand-name">Igan's<br><span>Budbod House</span></div>
        <div class="brand-role">Admin Panel</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item active"><i class="fas fa-home"></i> Dashboard</a>
      <a href="orders.html" class="nav-item"><i class="fas fa-clipboard-list"></i> Orders</a>
      <a href="menu-manage.html" class="nav-item"><i class="fas fa-utensils"></i> Menu</a>
      <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Users</a>
      <a href="tables.html" class="nav-item"><i class="fas fa-table"></i> Tables & QR</a>
      <a href="reports.html" class="nav-item"><i class="fas fa-chart-line"></i> Reports</a>
      <a href="reviews.html" class="nav-item"><i class="fas fa-star"></i> Reviews</a>
      <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div id="sidebar-user"></div>
      <button class="btn btn-ghost btn-sm btn-block" onclick="logout()" style="margin-top:10px;">Sign Out</button>
    </div>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 class="admin-page-title">Dashboard</h1>
        <p class="admin-page-sub">Welcome back! Here's what's happening today.</p>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <span id="last-updated" style="font-size:0.78rem;color:var(--text-muted);"></span>
        <button class="notification-btn" id="notification-btn" onclick="toggleNotificationDrawer()">
          <i class="fas fa-bell"></i>
          <span class="notification-badge" id="notification-badge"></span>
        </button>
        <button class="btn btn-outline btn-sm" onclick="loadDashboard()"><i class="fas fa-rotate-right"></i> Refresh</button>
      </div>
    </div>
    <div class="kpi-grid" id="kpi-grid">
      <div class="kpi-card skeleton" style="height:100px;"></div>
      <div class="kpi-card skeleton" style="height:100px;"></div>
      <div class="kpi-card skeleton" style="height:100px;"></div>
      <div class="kpi-card skeleton" style="height:100px;"></div>
      <div class="kpi-card skeleton" style="height:100px;"></div>
    </div>
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-card-header">
          <h3>7-Day Revenue</h3>
          <span id="revenue-total" class="badge badge-primary"></span>
        </div>
        <div style="position:relative;height:220px;">
          <canvas id="salesChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-card-header">
          <h3>Top Menu Items</h3>
        </div>
        <div style="position:relative;height:220px;">
          <canvas id="itemsChart"></canvas>
        </div>
      </div>
    </div>
    <div class="lower-grid">
      <div class="card card-padded">
        <h3 style="margin-bottom:20px;font-size:1rem;font-weight:600;">Order Status Overview</h3>
        <div id="status-breakdown"></div>
      </div>
      <div class="card card-padded">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
          <h3 style="font-size:1rem;font-weight:600;">Recent Orders</h3>
          <a href="orders.html" class="btn btn-ghost btn-sm">View All →</a>
        </div>
        <div id="recent-orders"></div>
      </div>
    </div>
  </main>
  
  <!-- Notification Drawer -->
  <div class="notification-drawer-overlay" id="notification-drawer-overlay" onclick="closeNotificationDrawer()"></div>
  <div class="notification-drawer" id="notification-drawer">
    <div class="notification-drawer-header">
      <h3><i class="fas fa-bell"></i> Notifications</h3>
      <button class="notification-drawer-close" onclick="closeNotificationDrawer()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="notification-drawer-actions">
      <button class="btn-mark-all-read" onclick="markAllNotificationsAsRead()">
        <i class="fas fa-check-double"></i> Mark all as read
      </button>
    </div>
    <div class="notifications-list" id="notifications-list">
      <!-- Notifications will be loaded here -->
    </div>
  </div>
</div>
<script src="../js/auth.js"></script>
<script>
requireRole('admin');
// Sidebar user
const u = Session.getUser();
if (u) {
  const initials = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('sidebar-user').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:36px;height:36px;background:var(--primary);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:0.85rem;">${initials}</div>
      <div><div style="font-weight:600;font-size:0.88rem;">${u.name}</div><div style="font-size:0.75rem;color:var(--text-muted);">Admin</div></div>
    </div>`;
}
let salesChart, itemsChart;
async function loadDashboard() {
  try {
    const data = await apiFetch('/admin/stats');
    const d = data.data;
    document.getElementById('kpi-grid').innerHTML = `
      <div class="kpi-card"><div class="kpi-icon"><i class="fas fa-clipboard-list"></i></div><div class="kpi-body"><div class="kpi-num">${d.todayOrders || 0}</div><div class="kpi-label">Today's Orders</div></div></div>
      <div class="kpi-card"><div class="kpi-icon"><i class="fas fa-dollar-sign"></i></div><div class="kpi-body"><div class="kpi-num">${formatCurrency(d.todayRevenue || 0)}</div><div class="kpi-label">Today's Revenue</div></div></div>
      <div class="kpi-card"><div class="kpi-icon"><i class="fas fa-box"></i></div><div class="kpi-body"><div class="kpi-num">${d.totalOrders || 0}</div><div class="kpi-label">Total Orders</div></div></div>
      <div class="kpi-card"><div class="kpi-icon"><i class="fas fa-credit-card"></i></div><div class="kpi-body"><div class="kpi-num">${formatCurrency(d.totalRevenue || 0)}</div><div class="kpi-label">Total Revenue</div></div></div>
    `;
    document.getElementById('last-updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
    const dailySales = d.dailySales || [];
    const topItems = d.topItems || [];
    document.getElementById('revenue-total').textContent = formatCurrency(dailySales.reduce((s,x)=>s + (x.revenue || 0),0)) + ' (7 days)';
    const salesCtx = document.getElementById('salesChart').getContext('2d');
    if (salesChart) salesChart.destroy();
    salesChart = new Chart(salesCtx, {
      type: 'bar',
      data: {
        labels: dailySales.map(x => x.date),
        datasets: [{
          label: 'Revenue (₱)',
          data: dailySales.map(x => x.revenue || 0),
          backgroundColor: 'rgba(200,68,10,0.7)',
          borderRadius: 6, borderSkipped: false
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } }, x: { grid: { display: false } } } }
    });
    const itemsCtx = document.getElementById('itemsChart').getContext('2d');
    if (itemsChart) itemsChart.destroy();
    itemsChart = new Chart(itemsCtx, {
      type: 'doughnut',
      data: {
        labels: topItems.length > 0
          ? topItems.map(x => x.name.length > 18 ? x.name.slice(0,16)+'...' : x.name)
          : ['No items'],
        datasets: [{
          data: topItems.length > 0 ? topItems.map(x => x.count) : [1],
          backgroundColor: topItems.length > 0
            ? ['#C8440A','#F5A623','#2E7D4F','#1E40AF','#9333EA']
            : ['#cccccc'],
          borderWidth: 0,
          hoverOffset: 4
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 12 } } } }
    });
    // Status breakdown
    const sc = d.statusCounts || { pending: 0, preparing: 0, ready: 0, served: 0, cancelled: 0 };
    const total = Object.values(sc).reduce((a,b)=>a+b,0)||1;
    document.getElementById('status-breakdown').innerHTML = Object.entries(sc).map(([s,n]) => `
      <div style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:0.85rem;">
          <span>${statusBadge(s)}</span><span style="font-weight:600;">${n}</span>
        </div>
        <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;">
          <div style="height:100%;width:${Math.round(n/total*100)}%;background:var(--primary);border-radius:3px;transition:width 0.5s;"></div>
        </div>
      </div>`).join('');
    // Recent orders
    const recentData = await apiFetch('/orders?status=pending,preparing,ready');
    const recent = (recentData.data || []).slice(0, 6);
    document.getElementById('recent-orders').innerHTML = recent.length === 0
      ? '<div class="empty-state" style="padding:20px;"><div class="icon" style="font-size:2.5rem;"><i class="fas fa-wand-magic-sparkles"></i></div><h3>No active orders</h3></div>'
      : recent.map(o => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
          <div>
            <div style="font-weight:600;font-size:0.88rem;">#${o.orderNumber}</div>
            <div style="font-size:0.78rem;color:var(--text-muted);">${(o.items || []).length} items · ${formatDate(o.createdAt)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span>${formatCurrency(o.totalAmount || 0)}</span>
            ${statusBadge(o.status)}
          </div>
        </div>`).join('');
  } catch (e) { console.error(e); }
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// Notification functions
let notifications = [];

async function loadNotifications() {
  try {
    const res = await apiFetch('/notifications');
    notifications = res.data || [];
    renderNotifications();
    updateNotificationBadge();
  } catch (err) {
    console.error('Error loading notifications:', err);
  }
}

function renderNotifications() {
  const container = document.getElementById('notifications-list');
  if (!container) {
    console.error('notifications-list element not found!');
    return;
  }
  
  if (!notifications || notifications.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="padding: 40px 0;">
        <div class="icon"><i class="fas fa-bell-slash"></i></div>
        <h3>No notifications</h3>
        <p>You'll see notifications here when orders are placed or payments are received</p>
      </div>
    `;
    return;
  }
  container.innerHTML = notifications.map(n => {
    let iconClass = '';
    let icon = '';
    if (n.type === 'payment') {
      iconClass = 'payment';
      icon = '<i class="fas fa-credit-card"></i>';
    } else if (n.type === 'order') {
      iconClass = 'order';
      icon = '<i class="fas fa-receipt"></i>';
    } else {
      iconClass = 'system';
      icon = '<i class="fas fa-bell"></i>';
    }
    return `
      <div class="notification-item ${n.read ? '' : 'unread'}">
        <div class="notification-item-icon ${iconClass}">${icon}</div>
        <div class="notification-item-content">
          <div class="notification-item-title">${n.title}</div>
          <div class="notification-item-message">${n.message}</div>
          <div class="notification-item-time">${formatTimeAgo(n.createdAt)}</div>
        </div>
      </div>
    `;
  }).join('');
}

function updateNotificationBadge() {
  const badge = document.getElementById('notification-badge');
  const unreadCount = notifications.filter(n => !n.read).length;
  if (unreadCount > 0) {
    badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

function toggleNotificationDrawer() {
  const overlay = document.getElementById('notification-drawer-overlay');
  const drawer = document.getElementById('notification-drawer');
  overlay.classList.toggle('open');
  drawer.classList.toggle('open');
  // Load notifications when opening
  if (drawer.classList.contains('open')) {
    loadNotifications();
  }
}

function closeNotificationDrawer() {
  document.getElementById('notification-drawer-overlay').classList.remove('open');
  document.getElementById('notification-drawer').classList.remove('open');
}

async function markAllNotificationsAsRead() {
  try {
    await apiFetch('/notifications/read-all', { method: 'PATCH' });
    await loadNotifications();
  } catch (err) {
    console.error('Error marking all as read:', err);
  }
}

function formatTimeAgo(dateStr) {
  const date = new Date(dateStr);
  const now = new Date();
  const diffMs = now - date;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMins / 60);
  const diffDays = Math.floor(diffHours / 24);
  
  if (diffMins < 1) return 'Just now';
  if (diffMins < 60) return `${diffMins} minute${diffMins > 1 ? 's' : ''} ago`;
  if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
  return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
}

// Smooth navigation handler
function setupSmoothNavigation() {
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', (e) => {
      const href = item.getAttribute('href');
      if (href && !href.startsWith('#')) {
        e.preventDefault();
        document.body.classList.add('page-exiting');
        setTimeout(() => {
          window.location.href = href;
        }, 200);
      }
    });
  });
}

document.addEventListener('DOMContentLoaded', () => {
  // Add page loaded class for transition
  document.body.classList.add('page-loaded');
  // Setup smooth navigation
  setupSmoothNavigation();
  loadDashboard();
  loadNotifications();
  setInterval(loadDashboard, 30000);
  // Poll for new notifications every 30 seconds
  setInterval(loadNotifications, 30000);
});
</script>
</body>
</html>
