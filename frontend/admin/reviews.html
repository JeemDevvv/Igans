<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="../css/favicon.jpg">
<title>Reviews — Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .review-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; padding: 24px; }
  .review-item { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 20px; transition: transform 0.2s; position: relative; }
  .review-item:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
  .review-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .review-user { font-weight: 700; color: #1C1008; font-size: 1rem; }
  .review-date { font-size: 0.75rem; color: var(--text-muted); }
  .review-rating { color: #F5A623; margin-bottom: 8px; font-size: 0.9rem; }
  .review-comment { font-size: 0.9rem; line-height: 1.5; color: #444; font-style: italic; margin-bottom: 15px; }
  .review-order-info { background: #F8F4F0; border-radius: 8px; padding: 10px; font-size: 0.8rem; color: #666; }
  .review-actions { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; }
  .btn-delete-review { background: #FEE2E2; color: #DC2626; border: none; padding: 6px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  .btn-delete-review:hover { background: #FCA5A5; }
  .filter-bar {
    display: flex;
    justify-content: center;
    margin: 20px;
    gap: 20px;
    align-items: center;
  }
</style>
</head>
<body>
<div class="admin-shell">
  <div class="mobile-nav-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div>
        <div class="brand-name">Igan's<br><span>Budbod House</span></div>
        <div class="brand-role">Admin Panel</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
      <a href="orders.html" class="nav-item"><i class="fas fa-clipboard-list"></i> Orders</a>
      <a href="menu-manage.html" class="nav-item"><i class="fas fa-utensils"></i> Menu</a>
      <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Users</a>
      <a href="tables.html" class="nav-item"><i class="fas fa-table"></i> Tables & QR</a>
      <a href="reports.html" class="nav-item"><i class="fas fa-chart-line"></i> Reports</a>
      <a href="reviews.html" class="nav-item active"><i class="fas fa-star"></i> Reviews</a>
      <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="sidebar-footer"><button class="btn btn-ghost btn-sm btn-block" onclick="logout()">Sign Out</button></div>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 class="admin-page-title">Customer Reviews</h1>
        <p class="admin-page-sub">Manage and monitor customer feedback</p>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button class="notification-btn" id="notification-btn" onclick="toggleNotificationDrawer()">
          <i class="fas fa-bell"></i>
          <span class="notification-badge" id="notification-badge"></span>
        </button>
        <button class="btn btn-outline btn-sm" onclick="loadReviews()">↻ Refresh</button>
      </div>
    </div>
    <div class="filter-bar">
      <span class="filter-label">Filters:</span>
      <select class="filter-select" id="rating-filter" onchange="loadReviews()">
        <option value="">All Ratings</option>
        <option value="5">5 Stars</option>
        <option value="4">4 Stars</option>
        <option value="3">3 Stars</option>
        <option value="2">2 Stars</option>
        <option value="1">1 Star</option>
      </select>
      <input type="date" class="filter-input" id="date-filter" onchange="loadReviews()" style="min-width:140px;">
    </div>
    <div id="loading" style="text-align:center;padding:60px 20px;">
      <div class="spinner" style="width:40px;height:40px;margin:0 auto 16px;"></div>
      <p style="color:var(--text-muted);">Loading reviews...</p>
    </div>
    <div class="review-grid" id="review-grid"></div>
    <div id="empty-state" style="display:none;text-align:center;padding:100px 20px;">
      <div style="font-size:4rem;margin-bottom:20px;">💬</div>
      <h3>No reviews found</h3>
      <p style="color:var(--text-muted);">Reviews will appear here once customers start giving feedback.</p>
    </div>
  </main>
  
  <!-- Notification Drawer -->
  <div class="notification-drawer-overlay" id="notification-drawer-overlay" onclick="closeNotificationDrawer()"></div>
  <div class="notification-drawer" id="notification-drawer">
    <div class="notification-drawer-header">
      <h3><i class="fas fa-bell"></i> Notifications</h3>
      <button class="notification-drawer-close" onclick="closeNotificationDrawer()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="notification-drawer-actions">
      <button class="btn-mark-all-read" onclick="markAllNotificationsAsRead()">
        <i class="fas fa-check-double"></i> Mark all as read
      </button>
    </div>
    <div class="notifications-list" id="notifications-list">
      <!-- Notifications will be loaded here -->
    </div>
  </div>

</div>
<script src="../js/auth.js"></script>
<script>
requireRole('admin');
async function loadReviews() {
  const rating = document.getElementById('rating-filter').value;
  const date = document.getElementById('date-filter').value;
  let url = '/reviews?';
  if (rating) url += `rating=${rating}&`;
  if (date) url += `date=${date}&`;
  try {
    const data = await apiFetch(url);
    renderReviews(data.data);
  } catch (err) {
    showToast(err.message, 'error');
  }
}
function renderReviews(reviews) {
  document.getElementById('loading').style.display = 'none';
  const grid = document.getElementById('review-grid');
  const empty = document.getElementById('empty-state');
  if (reviews.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = reviews.map(r => `
    <div class="review-item" id="review-${r._id}">
      <div class="review-actions">
        <button class="btn-delete-review" title="Delete Review" onclick="deleteReview('${r._id}')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/></svg>
        </button>
      </div>
      <div class="review-header">
        <div class="review-user">${r.customer?.name || 'Guest Customer'}</div>
        <div class="review-date">${new Date(r.createdAt).toLocaleDateString()}</div>
      </div>
      <div class="review-rating">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
      <div class="review-comment">${r.comment || 'No comment provided.'}</div>
      <div class="review-order-info">
        <strong>Order #${r.order?.orderNumber || 'N/A'}</strong><br>
        ${r.order?.items?.length || 0} items purchased
      </div>
    </div>
  `).join('');
}
async function deleteReview(id) {
  if (!confirm('Are you sure you want to delete this review? This action cannot be undone.')) return;
  try {
    await apiFetch(`/reviews/${id}`, { method: 'DELETE' });
    showToast('Review deleted successfully');
    document.getElementById(`review-${id}`).remove();
    if (document.getElementById('review-grid').children.length === 0) {
      document.getElementById('empty-state').style.display = 'block';
    }
  } catch (err) {
    showToast(err.message, 'error');
  }
}

// Notification functions
let notifications = [];

async function loadNotifications() {
  try {
    const res = await apiFetch('/notifications');
    notifications = res.data || [];
    renderNotifications();
    updateNotificationBadge();
  } catch (err) {
    console.error('Error loading notifications:', err);
  }
}

function renderNotifications() {
  const container = document.getElementById('notifications-list');
  if (!notifications || notifications.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="padding: 40px 0;">
        <div class="icon"><i class="fas fa-bell-slash"></i></div>
        <h3>No notifications</h3>
        <p>You'll see notifications here when orders are placed or payments are received</p>
      </div>
    `;
    return;
  }
  container.innerHTML = notifications.map(n => {
    let iconClass = '';
    let icon = '';
    if (n.type === 'payment') {
      iconClass = 'payment';
      icon = '<i class="fas fa-credit-card"></i>';
    } else if (n.type === 'order') {
      iconClass = 'order';
      icon = '<i class="fas fa-receipt"></i>';
    } else {
      iconClass = 'system';
      icon = '<i class="fas fa-bell"></i>';
    }
    return `
      <div class="notification-item ${n.read ? '' : 'unread'}">
        <div class="notification-item-icon ${iconClass}">${icon}</div>
        <div class="notification-item-content">
          <div class="notification-item-title">${n.title}</div>
          <div class="notification-item-message">${n.message}</div>
          <div class="notification-item-time">${formatTimeAgo(n.createdAt)}</div>
        </div>
      </div>
    `;
  }).join('');
}

function updateNotificationBadge() {
  const badge = document.getElementById('notification-badge');
  const unreadCount = notifications.filter(n => !n.read).length;
  if (unreadCount > 0) {
    badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

function toggleNotificationDrawer() {
  console.log('🔔 toggleNotificationDrawer called in reviews.html');
  const overlay = document.getElementById('notification-drawer-overlay');
  const drawer = document.getElementById('notification-drawer');
  console.log('🔔 overlay:', overlay, 'drawer:', drawer);
  overlay.classList.toggle('open');
  drawer.classList.toggle('open');
  if (drawer.classList.contains('open')) {
    loadNotifications();
  }
}

function closeNotificationDrawer() {
  document.getElementById('notification-drawer-overlay').classList.remove('open');
  document.getElementById('notification-drawer').classList.remove('open');
}

async function markAllNotificationsAsRead() {
  try {
    await apiFetch('/notifications/read-all', { method: 'PATCH' });
    await loadNotifications();
  } catch (err) {
    console.error('Error marking all as read:', err);
  }
}

function formatTimeAgo(dateStr) {
  const date = new Date(dateStr);
  const now = new Date();
  const diffMs = now - date;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMins / 60);
  const diffDays = Math.floor(diffHours / 24);
  
  if (diffMins < 1) return 'Just now';
  if (diffMins < 60) return `${diffMins} minute${diffMins > 1 ? 's' : ''} ago`;
  if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
  return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// Smooth navigation handler
function setupSmoothNavigation() {
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', (e) => {
      const href = item.getAttribute('href');
      if (href && !href.startsWith('#')) {
        e.preventDefault();
        document.body.classList.add('page-exiting');
        setTimeout(() => {
          window.location.href = href;
        }, 200);
      }
    });
  });
}

document.addEventListener('DOMContentLoaded', () => {
  // Add page loaded class for transition
  document.body.classList.add('page-loaded');
  // Setup smooth navigation
  setupSmoothNavigation();
  loadReviews();
  loadNotifications();
  setInterval(loadNotifications, 30000);
});
</script>
</body>
</html>
