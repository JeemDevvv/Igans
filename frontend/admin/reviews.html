<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="../css/favicon.jpg">
<title>Reviews — Admin</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .review-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; padding: 24px; }
  .review-item { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 20px; transition: transform 0.2s; position: relative; }
  .review-item:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
  .review-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .review-user { font-weight: 700; color: #1C1008; font-size: 1rem; }
  .review-date { font-size: 0.75rem; color: var(--text-muted); }
  .review-rating { color: #F5A623; margin-bottom: 8px; font-size: 0.9rem; }
  .review-comment { font-size: 0.9rem; line-height: 1.5; color: #444; font-style: italic; margin-bottom: 15px; }
  .review-order-info { background: #F8F4F0; border-radius: 8px; padding: 10px; font-size: 0.8rem; color: #666; }
  .review-actions { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; }
  .btn-delete-review { background: #FEE2E2; color: #DC2626; border: none; padding: 6px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  .btn-delete-review:hover { background: #FCA5A5; }
  .filter-bar {
    display: flex;
    justify-content: center;
    margin: 20px;
    gap: 20px;
    align-items: center;
  }
</style>
</head>
<body>
<div class="admin-shell">
  <div class="mobile-nav-toggle" onclick="toggleSidebar()">☰</div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div>
        <div class="brand-name">Igan's<br><span>Budbod House</span></div>
        <div class="brand-role">Admin Panel</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">Dashboard</a>
      <a href="orders.html" class="nav-item">Orders</a>
      <a href="menu-manage.html" class="nav-item">Menu</a>
      <a href="users.html" class="nav-item">Users</a>
      <a href="tables.html" class="nav-item">Tables & QR</a>
      <a href="reports.html" class="nav-item">Reports</a>
      <a href="reviews.html" class="nav-item active">Reviews</a>
      <a href="settings.html" class="nav-item">Settings</a>
    </nav>
    <div class="sidebar-footer"><button class="btn btn-ghost btn-sm btn-block" onclick="logout()">Sign Out</button></div>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 class="admin-page-title">Customer Reviews</h1>
        <p class="admin-page-sub">Manage and monitor customer feedback</p>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-outline btn-sm" onclick="loadReviews()">↻ Refresh</button>
      </div>
    </div>
    <div class="filter-bar">
      <span class="filter-label">Filters:</span>
      <select class="filter-select" id="rating-filter" onchange="loadReviews()">
        <option value="">All Ratings</option>
        <option value="5">5 Stars</option>
        <option value="4">4 Stars</option>
        <option value="3">3 Stars</option>
        <option value="2">2 Stars</option>
        <option value="1">1 Star</option>
      </select>
      <input type="date" class="filter-input" id="date-filter" onchange="loadReviews()" style="min-width:140px;">
    </div>
    <div id="loading" style="text-align:center;padding:60px 20px;">
      <div class="spinner" style="width:40px;height:40px;margin:0 auto 16px;"></div>
      <p style="color:var(--text-muted);">Loading reviews...</p>
    </div>
    <div class="review-grid" id="review-grid"></div>
    <div id="empty-state" style="display:none;text-align:center;padding:100px 20px;">
      <div style="font-size:4rem;margin-bottom:20px;">💬</div>
      <h3>No reviews found</h3>
      <p style="color:var(--text-muted);">Reviews will appear here once customers start giving feedback.</p>
    </div>
  </main>
</div>
<script src="../js/auth.js"></script>
<script>
requireRole('admin');
async function loadReviews() {
  const rating = document.getElementById('rating-filter').value;
  const date = document.getElementById('date-filter').value;
  let url = '/reviews?';
  if (rating) url += `rating=${rating}&`;
  if (date) url += `date=${date}&`;
  try {
    const data = await apiFetch(url);
    renderReviews(data.data);
  } catch (err) {
    showToast(err.message, 'error');
  }
}
function renderReviews(reviews) {
  document.getElementById('loading').style.display = 'none';
  const grid = document.getElementById('review-grid');
  const empty = document.getElementById('empty-state');
  if (reviews.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = reviews.map(r => `
    <div class="review-item" id="review-${r._id}">
      <div class="review-actions">
        <button class="btn-delete-review" title="Delete Review" onclick="deleteReview('${r._id}')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/></svg>
        </button>
      </div>
      <div class="review-header">
        <div class="review-user">${r.customer?.name || 'Guest Customer'}</div>
        <div class="review-date">${new Date(r.createdAt).toLocaleDateString()}</div>
      </div>
      <div class="review-rating">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
      <div class="review-comment">${r.comment || 'No comment provided.'}</div>
      <div class="review-order-info">
        <strong>Order #${r.order?.orderNumber || 'N/A'}</strong><br>
        ${r.order?.items?.length || 0} items purchased
      </div>
    </div>
  `).join('');
}
async function deleteReview(id) {
  if (!confirm('Are you sure you want to delete this review? This action cannot be undone.')) return;
  try {
    await apiFetch(`/reviews/${id}`, { method: 'DELETE' });
    showToast('Review deleted successfully');
    document.getElementById(`review-${id}`).remove();
    if (document.getElementById('review-grid').children.length === 0) {
      document.getElementById('empty-state').style.display = 'block';
    }
  } catch (err) {
    showToast(err.message, 'error');
  }
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
document.addEventListener('DOMContentLoaded', loadReviews);
</script>
</body>
</html>
