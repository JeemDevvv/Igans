<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="../css/favicon.jpg">
<title>Users — Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-shell">
  <div class="mobile-nav-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div>
        <div class="brand-name">Igan's<br><span>Budbod House</span></div>
        <div class="brand-role">Admin Panel</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
      <a href="orders.html" class="nav-item"><i class="fas fa-clipboard-list"></i> Orders</a>
      <a href="menu-manage.html" class="nav-item"><i class="fas fa-utensils"></i> Menu</a>
      <a href="users.html" class="nav-item active"><i class="fas fa-users"></i> Users</a>
      <a href="tables.html" class="nav-item"><i class="fas fa-table"></i> Tables & QR</a>
      <a href="reports.html" class="nav-item"><i class="fas fa-chart-line"></i> Reports</a>
      <a href="reviews.html" class="nav-item"><i class="fas fa-star"></i> Reviews</a>
      <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="sidebar-footer"><button class="btn btn-ghost btn-sm btn-block" onclick="logout()">Sign Out</button></div>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1 class="admin-page-title">Users</h1><p class="admin-page-sub">Manage staff accounts</p></div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button class="notification-btn" id="notification-btn" onclick="toggleNotificationDrawer()">
          <i class="fas fa-bell"></i>
          <span class="notification-badge" id="notification-badge"></span>
        </button>
        <button class="btn btn-primary" onclick="openUserModal()">+ Add User</button>
      </div>
    </div>
    <div class="admin-table-wrap" style="padding-top:24px;">
      <div class="table-toolbar">
        <div class="search-input-wrap"><i class="fas fa-magnifying-glass"></i><input type="text" id="search-users" placeholder="Search name, username, or email..." oninput="filterUsers()"></div>
        <div style="display:flex;gap:12px;align-items:center;">
          <span class="filter-label">Role:</span>
          <select class="filter-select" id="role-filter" onchange="filterUsers()">
            <option value="">All Roles</option>
            <option value="admin">Admin</option>
            <option value="kitchen">Kitchen</option>
            <option value="staff">Staff</option>
          </select>
          <button class="btn btn-ghost btn-sm" onclick="loadUsers()" style="margin-left:8px;">Refresh</button>
        </div>
        <span id="user-count" style="font-size:0.85rem;color:var(--text-muted);"></span>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Joined</th><th>Actions</th></tr></thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
  
  <!-- Notification Drawer -->
  <div class="notification-drawer-overlay" id="notification-drawer-overlay" onclick="closeNotificationDrawer()"></div>
  <div class="notification-drawer" id="notification-drawer">
    <div class="notification-drawer-header">
      <h3><i class="fas fa-bell"></i> Notifications</h3>
      <button class="notification-drawer-close" onclick="closeNotificationDrawer()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="notification-drawer-actions">
      <button class="btn-mark-all-read" onclick="markAllNotificationsAsRead()">
        <i class="fas fa-check-double"></i> Mark all as read
      </button>
    </div>
    <div class="notifications-list" id="notifications-list">
      <!-- Notifications will be loaded here -->
    </div>
  </div>

</div>
<!-- User modal (add/edit) -->
<div class="modal-overlay" id="user-modal">
  <div class="modal" style="max-width:440px;">
    <div class="modal-header"><h2 id="modal-title">Add User</h2><button class="modal-close" onclick="closeUserModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Full Name *</label><input type="text" id="u-name" class="form-control"></div>
      <div class="form-group"><label class="form-label">Username *</label><input type="text" id="u-username" class="form-control"></div>
      <div class="form-group"><label class="form-label">Email *</label><input type="email" id="u-email" class="form-control"></div>
      <div class="form-group"><label class="form-label">Password *</label><input type="password" id="u-pass" class="form-control" placeholder="Min 6 characters"></div>
      <div class="form-group">
        <label class="form-label">Role *</label>
        <select id="u-role" class="form-control">
          <option value="staff">Staff</option>
          <option value="kitchen">Kitchen</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeUserModal()">Cancel</button>
      <button class="btn btn-primary" id="modal-submit-btn" onclick="saveUser()">Add User</button>
    </div>
  </div>
</div>
<script src="../js/auth.js"></script>
<script>
requireRole('admin');
let allUsers = [];
let editingUserId = null;
async function loadUsers() {
  const data = await apiFetch('/admin/users');
  allUsers = data.data;
  filterUsers();
}
function filterUsers() {
  const q = document.getElementById('search-users').value.toLowerCase();
  const role = document.getElementById('role-filter').value;
  let users = allUsers;
  if (q) users = users.filter(u => u.name.toLowerCase().includes(q) || u.username?.toLowerCase().includes(q) || u.email.toLowerCase().includes(q));
  if (role) users = users.filter(u => u.role === role);
  document.getElementById('user-count').textContent = `${users.length} user${users.length !== 1 ? 's' : ''}`;
  const roleIcons = { admin: '<i class="fas fa-gear"></i>', kitchen: '<i class="fas fa-user-chef"></i>', staff: '<i class="fas fa-user-tie"></i>' };
  const me = Session.getUser();
  document.getElementById('users-tbody').innerHTML = users.length === 0
    ? `<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--text-muted);">No users found</td></tr>`
    : users.map(u => `<tr>
        <td><div style="display:flex;align-items:center;gap:10px;">
          <div style="width:32px;height:32px;background:var(--primary);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;">${u.name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase()}</div>
          <span style="font-weight:600;">${u.name}</span></div></td>
        <td style="color:var(--text-muted);">${u.username || '-'}</td>
        <td style="color:var(--text-muted);">${u.email}</td>
        <td><span class="badge badge-primary">${roleIcons[u.role] || ''} ${u.role}</span></td>
        <td style="font-size:0.82rem;color:var(--text-muted);">${new Date(u.createdAt).toLocaleDateString()}</td>
        <td>${u._id !== me?.id ? `<button class="btn btn-ghost btn-sm" onclick="editUser('${u._id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteUser('${u._id}','${u.name}')">Delete</button>` : '<span style="font-size:0.8rem;color:var(--text-muted);">You</span>'}</td>
      </tr>`).join('');
}
async function deleteUser(id, name) {
  if (!confirm(`Delete user "${name}"?`)) return;
  try {
    await apiFetch(`/admin/users/${id}`, { method: 'DELETE' });
    showToast('User deleted');
    loadUsers();
  } catch(e) { showToast(e.message, 'error'); }
}
function openUserModal(userId = null) {
  editingUserId = userId;
  if (userId) {
    const user = allUsers.find(u => u._id === userId);
    document.getElementById('modal-title').textContent = 'Edit User';
    document.getElementById('u-name').value = user.name;
    document.getElementById('u-username').value = user.username || '';
    document.getElementById('u-email').value = user.email;
    document.getElementById('u-role').value = user.role;
    document.getElementById('u-pass').value = '';
    document.getElementById('modal-submit-btn').textContent = 'Save Changes';
    document.querySelector('.form-group:nth-child(4) label').innerHTML = 'Password <span style="font-size:0.8rem;color:var(--text-muted);">(leave blank to keep current)</span>';
  } else {
    document.getElementById('modal-title').textContent = 'Add User';
    ['u-name','u-username','u-email','u-pass'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('modal-submit-btn').textContent = 'Add User';
    document.querySelector('.form-group:nth-child(4) label').textContent = 'Password *';
  }
  document.getElementById('user-modal').classList.add('active');
}
function editUser(id) {
  openUserModal(id);
}
function closeUserModal() {
  document.getElementById('user-modal').classList.remove('active');
  editingUserId = null;
}
async function saveUser() {
  const name = document.getElementById('u-name').value.trim();
  const username = document.getElementById('u-username').value.trim();
  const email = document.getElementById('u-email').value.trim();
  const password = document.getElementById('u-pass').value;
  const role = document.getElementById('u-role').value;
  if (!name || !username || !email) { showToast('Name, username, and email required', 'error'); return; }
  if (!editingUserId && !password) { showToast('Password required for new user', 'error'); return; }
  if (password && password.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }
  try {
    if (editingUserId) {
      await apiFetch(`/admin/users/${editingUserId}`, { 
        method: 'PUT', 
        body: JSON.stringify({ name, username, email, password, role }) 
      });
      showToast('User updated!');
    } else {
      await apiFetch('/auth/register', { method: 'POST', body: JSON.stringify({ name, username, email, password, role }) });
      showToast('User added!');
    }
    closeUserModal();
    loadUsers();
  } catch(e) { showToast(e.message, 'error'); }
}


// Notification functions
let notifications = [];

async function loadNotifications() {
  try {
    const res = await apiFetch('/notifications');
    notifications = res.data || [];
    renderNotifications();
    updateNotificationBadge();
  } catch (err) {
    console.error('Error loading notifications:', err);
  }
}

function renderNotifications() {
  const container = document.getElementById('notifications-list');
  if (!notifications || notifications.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="padding: 40px 0;">
        <div class="icon"><i class="fas fa-bell-slash"></i></div>
        <h3>No notifications</h3>
        <p>You'll see notifications here when orders are placed or payments are received</p>
      </div>
    `;
    return;
  }
  container.innerHTML = notifications.map(n => {
    let iconClass = '';
    let icon = '';
    if (n.type === 'payment') {
      iconClass = 'payment';
      icon = '<i class="fas fa-credit-card"></i>';
    } else if (n.type === 'order') {
      iconClass = 'order';
      icon = '<i class="fas fa-receipt"></i>';
    } else {
      iconClass = 'system';
      icon = '<i class="fas fa-bell"></i>';
    }
    return `
      <div class="notification-item ${n.read ? '' : 'unread'}">
        <div class="notification-item-icon ${iconClass}">${icon}</div>
        <div class="notification-item-content">
          <div class="notification-item-title">${n.title}</div>
          <div class="notification-item-message">${n.message}</div>
          <div class="notification-item-time">${formatTimeAgo(n.createdAt)}</div>
        </div>
      </div>
    `;
  }).join('');
}

function updateNotificationBadge() {
  const badge = document.getElementById('notification-badge');
  const unreadCount = notifications.filter(n => !n.read).length;
  if (unreadCount > 0) {
    badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

function toggleNotificationDrawer() {
  console.log('🔔 toggleNotificationDrawer called in users.html');
  const overlay = document.getElementById('notification-drawer-overlay');
  const drawer = document.getElementById('notification-drawer');
  console.log('🔔 overlay:', overlay, 'drawer:', drawer);
  overlay.classList.toggle('open');
  drawer.classList.toggle('open');
  if (drawer.classList.contains('open')) {
    loadNotifications();
  }
}

function closeNotificationDrawer() {
  document.getElementById('notification-drawer-overlay').classList.remove('open');
  document.getElementById('notification-drawer').classList.remove('open');
}

async function markAllNotificationsAsRead() {
  try {
    await apiFetch('/notifications/read-all', { method: 'PATCH' });
    await loadNotifications();
  } catch (err) {
    console.error('Error marking all as read:', err);
  }
}

function formatTimeAgo(dateStr) {
  const date = new Date(dateStr);
  const now = new Date();
  const diffMs = now - date;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMins / 60);
  const diffDays = Math.floor(diffHours / 24);
  
  if (diffMins < 1) return 'Just now';
  if (diffMins < 60) return `${diffMins} minute${diffMins > 1 ? 's' : ''} ago`;
  if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
  return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
}

// Smooth navigation handler
function setupSmoothNavigation() {
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', (e) => {
      const href = item.getAttribute('href');
      if (href && !href.startsWith('#')) {
        e.preventDefault();
        document.body.classList.add('page-exiting');
        setTimeout(() => {
          window.location.href = href;
        }, 200);
      }
    });
  });
}

document.addEventListener('DOMContentLoaded', () => {
  // Add page loaded class for transition
  document.body.classList.add('page-loaded');
  // Setup smooth navigation
  setupSmoothNavigation();
  loadUsers();
  loadNotifications();
  setInterval(loadNotifications, 30000);
});

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
</script>
</body>
</html>
